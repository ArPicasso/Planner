name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx tgcloud push --force
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      - run: npx tgcloud migrate --yes
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
